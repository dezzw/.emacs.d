name: Update and Build Demacs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: update-and-build-demacs
  cancel-in-progress: false

jobs:
  update-flake:
    name: Update flake inputs
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.update.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Update flake inputs
        id: update
        run: |
          nix flake update

          if git diff --quiet flake.lock; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes to flake.lock"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "flake.lock has been updated"
          fi

      - name: Upload updated flake.lock
        if: steps.update.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flake-lock
          path: flake.lock
          retention-days: 1

  build-and-cache:
    name: Build ${{ matrix.package }} on ${{ matrix.os }}
    needs: update-flake
    if: needs.update-flake.outputs.has_changes == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        package: [demacs-igc, demacs-git, demacs-git-pgtk]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download updated flake.lock
        uses: actions/download-artifact@v4
        with:
          name: flake-lock

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: demacs
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build and push to Cachix
        run: |
          set -o pipefail
          nix build .#${{ matrix.package }} --no-link --print-build-logs --print-out-paths | cachix push demacs

  push-changes:
    name: Push flake.lock to repository
    needs: [update-flake, build-and-cache]
    if: needs.update-flake.outputs.has_changes == 'true' && needs.build-and-cache.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download updated flake.lock
        uses: actions/download-artifact@v4
        with:
          name: flake-lock

      - name: Configure Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Commit and push changes
        run: |
          git add flake.lock
          git commit -m "[Chore] Update flake inputs

          Builds verified on Linux and macOS"
          git pull --rebase --autostash
          git push
